<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1c0506" />
      <stop offset="60%" stop-color="#0d0203" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Metallic Red Metal Accent -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e27" />
      <stop offset="50%" stop-color="#b30006" />
      <stop offset="100%" stop-color="#660003" />
    </linearGradient>

    <!-- Metallic Gold/Brass Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe17d" />
      <stop offset="50%" stop-color="#cc9922" />
      <stop offset="100%" stop-color="#885500" />
    </linearGradient>

    <!-- White/Silver Metallic -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#dddddd" />
      <stop offset="100%" stop-color="#999999" />
    </linearGradient>

    <!-- Cyber Circuit Glow Filter -->
    <filter id="neonRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Matrix Digital Rain Texture (Heist Red Style) -->
  <g opacity="0.12" fill="#ff1e27" font-family="monospace" font-size="14" font-weight="bold">
    <text x="100" y="80">101001 01 101010</text>
    <text x="100" y="120">01 1101 HACK 01</text>
    <text x="100" y="160">BELLA CIAO 1010</text>
    <text x="100" y="200">10 00101 110100</text>
    
    <text x="800" y="100">0110 101001 01</text>
    <text x="800" y="140">MATRIX 1001 10</text>
    <text x="800" y="180">010101 11 0101</text>
    <text x="800" y="220">1101 001 10101</text>

    <text x="150" y="800">110100 10 1010</text>
    <text x="150" y="840">01 MATRIX 0110</text>
    <text x="750" y="820">101011 01 0010</text>
    <text x="750" y="860">HACK 11010 011</text>
  </g>

  <!-- Main Emblem Container with Drop Shadow -->
  <g filter="url(#shadow)">
    
    <!-- Outer Hexagonal Cyber Vault Frame -->
    <polygon points="500,80 850,280 850,680 500,880 150,680 150,280" 
             fill="#080203" stroke="url(#redGlow)" stroke-width="8" />
             
    <polygon points="500,100 830,290 830,670 500,860 170,670 170,290" 
             fill="none" stroke="#220507" stroke-width="4" stroke-dasharray="15 10" />

    <!-- Technical Crosshairs / Heist Plan Markers -->
    <line x1="500" y1="50" x2="500" y2="110" stroke="#b30006" stroke-width="3" />
    <line x1="500" y1="850" x2="500" y2="910" stroke="#b30006" stroke-width="3" />
    <line x1="120" y1="480" x2="180" y2="480" stroke="#b30006" stroke-width="3" />
    <line x1="820" y1="480" x2="880" y2="480" stroke="#b30006" stroke-width="3" />

    <!-- Cyber Circuit Lines (Matrix side of the heist) -->
    <g stroke="url(#redGlow)" stroke-width="3" fill="none" opacity="0.8" filter="url(#neonRedGlow)">
      <!-- Left side circuits -->
      <path d="M 200,320 L 280,320 L 320,360 L 320,440" />
      <circle cx="200" cy="320" r="5" fill="#ff1e27" />
      <circle cx="320" cy="440" r="5" fill="#ff1e27" />

      <path d="M 180,500 L 260,500 L 300,540" />
      <circle cx="180" cy="500" r="5" fill="#ff1e27" />

      <!-- Right side circuits -->
      <path d="M 800,320 L 720,320 L 680,360 L 680,440" />
      <circle cx="800" cy="320" r="5" fill="#ff1e27" />
      <circle cx="680" cy="440" r="5" fill="#ff1e27" />

      <path d="M 820,500 L 740,500 L 700,540" />
      <circle cx="820" cy="500" r="5" fill="#ff1e27" />
    </g>

    <!-- CENTERPIECE: DALI MASK WITH CYBERNETIC HACKER INTEGRATION -->
    <g id="dali-mask-cyber">
      
      <!-- Hood Silhouette (Money Heist Red Jumpsuit Hood) -->
      <path d="M 320,560 C 310,320 360,200 500,200 C 640,200 690,320 680,560 C 680,620 650,680 500,720 C 350,680 320,620 320,560 Z" 
            fill="url(#redGlow)" />
      
      <!-- Inner Hood Shadow -->
      <path d="M 345,550 C 338,360 380,230 500,230 C 620,230 662,360 655,550 C 640,620 590,665 500,695 C 410,665 360,620 345,550 Z" 
            fill="#0a0203" />

      <!-- Face Base (White Dali Mask) -->
      <path d="M 370,520 C 365,390 410,300 500,300 C 590,300 635,390 630,520 C 625,590 580,640 500,660 C 420,640 375,590 370,520 Z" 
            fill="url(#silverGrad)" />

      <!-- Shadow Contours on Mask -->
      <path d="M 500,300 C 560,300 600,350 605,450 C 580,420 540,410 500,430 C 460,410 420,420 395,450 C 400,350 440,300 500,300 Z" 
            fill="#e5e5e5" opacity="0.5" />
      
      <!-- Iconic Dali Brows (Exaggerated Arches) -->
      <path d="M 400,420 Q 440,370 480,420" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" />
      <path d="M 600,420 Q 560,370 520,420" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" />

      <!-- Eyes (Left: Real/Suspicious Dali Eye | Right: Cybernetic Red Matrix Eye) -->
      <!-- Left Eye -->
      <ellipse cx="440" cy="440" rx="20" ry="12" fill="#111" />
      <circle cx="440" cy="440" r="6" fill="#fff" />
      
      <!-- Right Eye (Hacker VR / Cyber Monocle) -->
      <ellipse cx="560" cy="440" rx="22" ry="14" fill="#111" />
      <circle cx="560" cy="440" r="12" fill="#b30006" />
      <circle cx="560" cy="440" r="5" fill="#ff1e27" filter="url(#neonRedGlow)" />
      <!-- Target reticle over right eye -->
      <circle cx="560" cy="440" r="20" fill="none" stroke="#ff1e27" stroke-width="1.5" stroke-dasharray="8 4" />

      <!-- Iconic Dali Mustache (Wide, Upcurved Points) -->
      <path d="M 500,535 Q 460,535 410,480 Q 460,550 500,545 Q 540,550 590,480 Q 540,535 500,535 Z" fill="#111" />

      <!-- Iconic Dali Goatee / Mouth -->
      <ellipse cx="500" cy="575" rx="16" ry="6" fill="#111" />
      <path d="M 490,600 Q 500,590 510,600 Q 500,625 490,600 Z" fill="#111" />

      <!-- Cybernetic Circuit Overlay on Mask (Right Side "Hacked" Face) -->
      <path d="M 560,320 L 570,360 L 610,380" stroke="#b30006" stroke-width="2.5" fill="none" />
      <path d="M 580,480 L 615,500 L 605,550" stroke="#b30006" stroke-width="2.5" fill="none" />
      <circle cx="610" cy="380" r="3" fill="#ff1e27" />
      <circle cx="605" cy="550" r="3" fill="#ff1e27" />

    </g>

    <!-- HEIST VAULT LOCK / MATRIX NODE SYMBOL (Bottom Center Overlay) -->
    <g transform="translate(500, 680)">
      <!-- Outer Gear/Lock Ring -->
      <circle cx="0" cy="0" r="45" fill="#0d0203" stroke="url(#goldGrad)" stroke-width="6" />
      <circle cx="0" cy="0" r="35" fill="none" stroke="#ffe17d" stroke-width="2" stroke-dasharray="6 4" />
      
      <!-- Keyhole / Hacker Padlock -->
      <path d="M -10,-5 L 10,-5 L 12,15 L -12,15 Z" fill="url(#goldGrad)" />
      <circle cx="0" cy="-10" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
      <circle cx="0" cy="3" r="3" fill="#000" />
    </g>

  </g>

  <!-- TYPOGRAPHY SECTION (Money Heist Bold Industrial Style) -->
  
  <!-- "HACKMATRIX" Title -->
  <g transform="translate(500, 800)">
    <!-- Drop Shadow for Text -->
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="76" font-weight="900" 
          letter-spacing="6" text-anchor="middle" fill="#000" opacity="0.9">
      HACKMATRIX
    </text>
    
    <!-- Main Red/White Heist Text -->
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="76" font-weight="900" 
          letter-spacing="6" text-anchor="middle" fill="url(#silverGrad)">
      HACK<tspan fill="url(#redGlow)">MATRIX</tspan>
    </text>

    <!-- Heist Red Tape Strike-through Accent -->
    <rect x="-240" y="-22" width="480" height="6" fill="#ff1e27" opacity="0.3" />
  </g>

  <!-- "1.0 - BUILD TODAY. SECURE TOMORROW." Subtitle Box -->
  <g transform="translate(500, 860)">
    <!-- Red Heist Badge Background -->
    <rect x="-220" y="-28" width="440" height="40" fill="#b30006" rx="4" />
    <rect x="-216" y="-24" width="432" height="32" fill="none" stroke="#ffe17d" stroke-width="1.5" rx="2" />
    
    <!-- Version & Theme Text -->
    <text x="0" y="-2" font-family="'Arial Black', sans-serif" font-size="20" font-weight="bold" 
          letter-spacing="3" text-anchor="middle" fill="#ffffff">
      1.0 <tspan fill="#ffe17d">|</tspan> JOIN THE HEIST
    </text>
  </g>

  <!-- Event Date & Host Stamp (Heist Classification Style) -->
  <g transform="translate(500, 930)">
    <text x="0" y="0" font-family="monospace" font-size="16" font-weight="bold" 
          letter-spacing="4" text-anchor="middle" fill="#888888">
      AUG 13-14, 2026 • VIIT AI&amp;DS • MATRIX CLUB
    </text>
  </g>

  <!-- Top "WANTED / CONFIDENTIAL" Heist Banner -->
  <g transform="translate(500, 120)">
    <rect x="-140" y="-18" width="280" height="28" fill="#111" stroke="#b30006" stroke-width="2" />
    <text x="0" y="2" font-family="'Courier New', monospace" font-size="14" font-weight="900" 
          letter-spacing="4" text-anchor="middle" fill="#ff1e27">
      [ TOP SECRET HACK ]
    </text>
  </g>

</svg>
